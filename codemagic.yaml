workflows:
  blofy-player-commercial-apk:
    name: BLOFY PLAYER Commercial Native APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        BLOFY_BASE_URL: "https://blofy-player-2026-production.up.railway.app"
    scripts:
      - name: Create Gradle wrapper
        script: |
          cd BLOFY-ANDROID-COMMERCIAL
          gradle wrapper --gradle-version 8.13
      - name: Validate and build APK
        script: |
          cd BLOFY-ANDROID-COMMERCIAL
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug -PBLOFY_BASE_URL="$BLOFY_BASE_URL"
    artifacts:
      - BLOFY-ANDROID-COMMERCIAL/app/build/outputs/apk/debug/*.apk
      - BLOFY-ANDROID-COMMERCIAL/app/build/reports/lint-results-debug.html
