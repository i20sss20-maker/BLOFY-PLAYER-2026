workflows:
  blofy-player-test-apk:
    name: BLOFY PLAYER Android Test APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
      vars:
        BLOFY_BASE_URL: "https://blofy-player-2026-production.up.railway.app"
    scripts:
      - name: Create Gradle wrapper
        script: |
          cd BLOFY-ANDROID-2026
          gradle wrapper --gradle-version 8.13
      - name: Validate and build APK
        script: |
          cd BLOFY-ANDROID-2026
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug -PBLOFY_BASE_URL="$BLOFY_BASE_URL"
    artifacts:
      - BLOFY-ANDROID-2026/app/build/outputs/apk/debug/*.apk
      - BLOFY-ANDROID-2026/app/build/reports/lint-results-debug.html
