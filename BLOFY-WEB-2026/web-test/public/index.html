<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08070d" />
    <meta name="description" content="BLOFY PLAYER — مشغل بث سريع للقنوات والأفلام والمسلسلات" />
    <title>BLOFY PLAYER</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/assets/blofy-logo-192.png" />
    <link rel="apple-touch-icon" href="/assets/blofy-logo-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite">
      <section class="boot-screen">
        <img src="/assets/blofy-logo-512.png" alt="BLOFY PLAYER" />
        <div class="boot-loader"><span></span></div>
      </section>
    </div>

    <div id="playerModal" class="player-modal" hidden>
      <div class="player-shell">
        <video id="videoPlayer" playsinline preload="metadata"></video>
        <div class="player-gradient"></div>
        <div class="player-topbar">
          <button class="icon-button" data-player-action="close" data-focusable aria-label="إغلاق المشغل">×</button>
          <div>
            <strong id="playerTitle">BLOFY PLAYER</strong>
            <small id="playerSubtitle">جاري التجهيز</small>
          </div>
          <span class="live-pill" id="livePill">LIVE</span>
        </div>
        <div id="playerStatus" class="player-status"><span class="spinner"></span><b>جاري تجهيز البث…</b><small>نختار أسرع طريقة تشغيل متوافقة</small></div>
        <div class="player-controls">
          <button class="icon-button" data-player-action="play" data-focusable aria-label="تشغيل أو إيقاف">▶</button>
          <input id="playerSeek" type="range" min="0" max="1000" value="0" data-focusable aria-label="تقديم وتأخير" />
          <span id="playerTime">00:00</span>
          <button class="icon-button" data-player-action="mute" data-focusable aria-label="كتم الصوت">🔊</button>
          <select id="qualitySelect" data-focusable aria-label="الجودة"><option value="auto">تلقائي</option></select>
          <select id="audioSelect" data-focusable aria-label="الصوت"><option value="auto">الصوت</option></select>
          <select id="subtitleSelect" data-focusable aria-label="الترجمة"><option value="off">الترجمة</option></select>
          <button class="icon-button" data-player-action="fullscreen" data-focusable aria-label="ملء الشاشة">⛶</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      (function () {
        window.__blofyBootTimer = setTimeout(function () {
          var root = document.getElementById("app");
          if (!root || !root.querySelector(".boot-screen")) return;
          root.innerHTML = '<section class="boot-screen"><img src="/assets/blofy-logo-512.png" alt="BLOFY PLAYER"><h2>تعذر بدء واجهة التطبيق</h2><p class="muted">أعد المحاولة، وإذا تكرر الخطأ حدّث Android System WebView.</p><div class="button-row"><button class="primary-button" onclick="location.reload()">إعادة المحاولة</button><button class="secondary-button" onclick="if(window.BlofyAndroid&&window.BlofyAndroid.exitApp){window.BlofyAndroid.exitApp()}else{history.back()}">إغلاق التطبيق</button></div></section>';
          var firstButton = root.querySelector("button");
          if (firstButton) firstButton.focus();
        }, 12000);
      })();
    </script>
    <script async src="/vendor/hls.min.js"></script>
    <script src="/app.compat.js?v=202608204"></script>
  </body>
</html>
