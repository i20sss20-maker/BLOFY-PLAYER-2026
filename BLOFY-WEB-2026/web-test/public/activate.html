<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08070d" />
    <title>تفعيل BLOFY PLAYER</title>
    <link rel="icon" href="/assets/blofy-logo-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="activation-screen">
      <section class="activation-card">
        <img class="activation-logo" src="/assets/blofy-logo-512.png" alt="BLOFY PLAYER" />
        <span class="eyebrow">تفعيل الجهاز</span>
        <h1>أدخل رقم الجهاز ورمز التفعيل</h1>
        <p class="muted">ستجد رقم الجهاز في شاشة الدخول أو الإعدادات داخل تطبيق BLOFY PLAYER.</p>
        <form id="activationForm" class="activation-form">
          <div class="field"><label for="deviceId">رقم الجهاز</label><input id="deviceId" name="deviceId" dir="ltr" autocomplete="off" placeholder="BLOFY-XXXX-XXXX-XXXX-XXXX" required /></div>
          <div class="field"><label for="activationCode">رمز التفعيل</label><input id="activationCode" name="code" dir="ltr" autocomplete="one-time-code" placeholder="BLOFY-XXXXXXXX-XXXX" required /></div>
          <button class="primary-button" type="submit">تفعيل الآن</button>
          <div id="activationMessage" class="activation-message" role="status"></div>
        </form>
        <small class="muted">BLOFY PLAYER مشغل فقط ولا يوفّر المحتوى أو الاشتراكات.</small>
      </section>
    </main>
    <script src="/activate.js"></script>
  </body>
</html>
