name: Apply BLOFY Playback VOD Fix

on:
  push:
    branches: [main]
    paths:
      - "tools/apply_playback_vod_fix.py"
      - ".github/workflows/apply-playback-vod-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python3 tools/apply_playback_vod_fix.py
      - name: Verify repair
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PlaybackTransportFactory.warmUpCronet(this)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/MainActivity.java
          grep -q '"complete".equals(database.metadata("sync_state", ""))' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/MainActivity.java
          grep -q 'private static final int VERSION = 3' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/CatalogDatabase.java
          grep -q 'setLoadControl(loadControl)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q '2026.08.23.9-7max-fast' BLOFY-ANDROID-2026/app/build.gradle.kts
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "blofy-ci"
          git config user.email "actions@users.noreply.github.com"
          git add BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/MainActivity.java \
                  BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/CatalogDatabase.java \
                  BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java \
                  BLOFY-ANDROID-2026/app/build.gradle.kts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: Cronet-first playback and complete VOD sync"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
