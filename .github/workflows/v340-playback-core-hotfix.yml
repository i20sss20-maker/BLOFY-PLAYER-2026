name: Build BLOFY v340 Playback Core Hotfix
on:
  workflow_dispatch:
  push:
    branches: [v340-playback-core-hotfix]
    paths:
      - "tools/apply_v340_playback_core_hotfix.py"
      - "tools/apply_v340_playback_core_hotfix_stage2.py"
      - "tools/apply_v340_playback_core_hotfix_stage3.py"
      - "tools/apply_v340_playback_core_hotfix_stage4.py"
      - "tools/apply_v340_playback_core_hotfix_stage5.py"
      - "tools/verify_package64.py"
      - ".github/workflows/v340-playback-core-hotfix.yml"
concurrency:
  group: v340-playback-core-hotfix-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Recreate COMPLETE and apply playback hotfix
        shell: bash
        run: |
          set -euo pipefail
          for f in apply_v329_hotfix.py apply_v330_hotfix.py apply_v330_vod_fix.py apply_v330_compile_fix.py apply_v331_precompat.py apply_v331_transport_manager.py apply_v331_compile_fix.py apply_v333_full_engines.py apply_v334_compat_engine.py apply_v336_diagnostics_reset.py apply_v337_vod_compat.py apply_v339_stability.py apply_v340_full2.py apply_v340_perf.py apply_v340_live_guard.py apply_v340_compile_fix.py apply_v340_session_guard.py apply_v340_route_learning.py apply_v340_final_foundation.py apply_v340_final_core.py apply_v340_source_probe.py apply_v340_verified_gate_runner2.py apply_v340_final_safety_r8.py apply_v340_r9_deep_logic_fix.py apply_v340_r10_warning_hardening.py; do python3 tools/$f; done
          python3 tools/apply_v340_r11_negotiator.py || true
          python3 tools/apply_v340_r11b_compat_fix.py
          python3 tools/apply_v340_r11c_field_fixes.py
          python3 tools/apply_v340_r11d_full_features.py
          python3 tools/apply_v340_r11e_stage1_stability.py
          python3 tools/apply_v340_r11e_stage2_stability_ui.py
          python3 tools/apply_v340_r11e_stage3_catalog_focus.py
          python3 tools/apply_v340_r11e_stage4_package_cache.py
          python3 tools/apply_v340_r11e_stage5_playback_health.py
          python3 tools/apply_v340_r11e_stage6_adaptive_runtime.py
          python3 tools/apply_v340_r11e_stage7_ui_watchdog.py
          python3 tools/apply_v340_r11e_stage8_catalog_query_cache.py
          python3 tools/apply_v340_r11e_stage9_http_route_breaker.py
          python3 tools/apply_v340_r11e_stage10_route_matrix.py
          python3 tools/apply_v340_r11e_complete_stamp.py
          python3 tools/apply_v340_playback_core_hotfix.py
          python3 tools/apply_v340_playback_core_hotfix_stage2.py
          python3 tools/apply_v340_playback_core_hotfix_stage3.py
          python3 tools/apply_v340_playback_core_hotfix_stage4.py
          python3 tools/apply_v340_playback_core_hotfix_stage5.py
          python3 tools/verify_package64.py
          grep -q 'PLAYBACK_LINK_TIMEOUT_MS = 10_000' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/BlofyApi.java
          grep -q 'playback-soft-failure' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackFailureMemory.java
          grep -q 'hotfix-proven-live-same-url' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'LIVE_STABLE_WINDOW_MS = 4_000L' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'liveFirstFrameSeen' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'DefaultLoadErrorHandlingPolicy(isLive() ? 6 : 3)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'DefaultLoadErrorHandlingPolicy(3)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'hotfix-steady-state-stall' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'STEADY_STATE_LIVE_STALL_MS = 5_500L' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'recoverProvenLiveSilently("steady-state-stall")' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'stage5-buffer-profile' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'setPrioritizeTimeOverSizeThresholdsForStreaming(true)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'transport=cronet-gms headers=parity' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackTransportFactory.java
          grep -q 'setResetTimeoutOnRedirects(true)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackTransportFactory.java
          grep -q 'r11e5-health-soft-observation' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackHealthMemory.java
          grep -q 'if (usingVlc || firstFrame) return;' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'versionCode = 1000358' BLOFY-ANDROID-2026/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.13'}
      - name: Compile tests lint and APKs
        working-directory: BLOFY-ANDROID-2026
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.13
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebug -PBLOFY_BASE_URL=https://blofy-player-2026-production.up.railway.app
      - name: APK structural QA
        shell: bash
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          DBG=BLOFY-ANDROID-2026/app/build/outputs/apk/debug/app-debug.apk
          REL=BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$DBG" && test -s "$REL"
          "$BT/aapt" dump badging "$DBG" | tee /tmp/badging.txt
          grep -q "package: name='tv.blofy.player'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "native-code:.*'arm64-v8a'" /tmp/badging.txt
          grep -q "native-code:.*'armeabi-v7a'" /tmp/badging.txt
          "$BT/apksigner" verify --verbose "$DBG"
          unzip -t "$DBG" | grep -q 'No errors detected'
          unzip -t "$REL" | grep -q 'No errors detected'
      - name: Prepare APK artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp BLOFY-ANDROID-2026/app/build/outputs/apk/debug/app-debug.apk dist/BLOFY-PLAYER-v340-PLAYBACK-HOTFIX-STAGE5-INSTALLABLE-TEST.apk
          cp BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk dist/BLOFY-PLAYER-v340-PLAYBACK-HOTFIX-STAGE5-UNSIGNED-RELEASE.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-v340-playback-hotfix-stage5-test
          path: |
            dist/BLOFY-PLAYER-v340-PLAYBACK-HOTFIX-STAGE5-INSTALLABLE-TEST.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-v340-playback-hotfix-stage5-unsigned-release
          path: |
            dist/BLOFY-PLAYER-v340-PLAYBACK-HOTFIX-STAGE5-UNSIGNED-RELEASE.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14