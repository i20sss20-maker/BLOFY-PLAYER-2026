name: Build BLOFY v340 Vision Stable
on:
  workflow_dispatch:
  push:
    branches: [v340-vision-stable]
    paths:
      - "tools/apply_v340_vision_ui_v1.py"
      - "tools/apply_v340_universal_compat_v1.py"
      - "tools/apply_v340_vision_playback_v2.py"
      - ".github/workflows/v340-vision-stable.yml"
concurrency:
  group: v340-vision-stable-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      V339_KEY_ARTIFACT_ID: 9664972711
      EXPECTED_CERT_SHA256: f54493426cd16e2fc67390c307937d5d2bb04f81201f4bad3355ae66ff4813a6
    steps:
      - uses: actions/checkout@v6
      - name: Recreate R11E COMPLETE stable baseline and apply Vision v2
        shell: bash
        run: |
          set -euo pipefail
          for f in apply_v329_hotfix.py apply_v330_hotfix.py apply_v330_vod_fix.py apply_v330_compile_fix.py apply_v331_precompat.py apply_v331_transport_manager.py apply_v331_compile_fix.py apply_v333_full_engines.py apply_v334_compat_engine.py apply_v336_diagnostics_reset.py apply_v337_vod_compat.py apply_v339_stability.py apply_v340_full2.py apply_v340_perf.py apply_v340_live_guard.py apply_v340_compile_fix.py apply_v340_session_guard.py apply_v340_route_learning.py apply_v340_final_foundation.py apply_v340_final_core.py apply_v340_source_probe.py apply_v340_verified_gate_runner2.py apply_v340_final_safety_r8.py apply_v340_r9_deep_logic_fix.py apply_v340_r10_warning_hardening.py; do python3 tools/$f; done
          python3 tools/apply_v340_r11_negotiator.py || true
          python3 tools/apply_v340_r11b_compat_fix.py
          python3 tools/apply_v340_r11c_field_fixes.py
          python3 tools/apply_v340_r11d_full_features.py
          python3 tools/apply_v340_r11e_stage1_stability.py
          python3 tools/apply_v340_r11e_stage2_stability_ui.py
          python3 tools/apply_v340_r11e_stage3_catalog_focus.py
          python3 tools/apply_v340_r11e_stage4_package_cache.py
          python3 tools/apply_v340_r11e_stage5_playback_health.py
          python3 tools/apply_v340_r11e_stage6_adaptive_runtime.py
          python3 tools/apply_v340_r11e_stage7_ui_watchdog.py
          python3 tools/apply_v340_r11e_stage8_catalog_query_cache.py
          python3 tools/apply_v340_r11e_stage9_http_route_breaker.py
          python3 tools/apply_v340_r11e_stage10_route_matrix.py
          python3 tools/apply_v340_r11e_complete_stamp.py
          python3 tools/apply_v340_vision_ui_v1.py
          python3 tools/apply_v340_universal_compat_v1.py
          python3 tools/apply_v340_vision_playback_v2.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player')
          for p in root.glob('*.java'):
              s=p.read_text(encoding='utf-8')
              p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n',encoding='utf-8')
          PY
          git diff --check
          grep -q 'class SettingsActivity' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SettingsActivity.java
          grep -q 'class PlayerActivity' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'class VodPlayerActivity' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'class ProviderCompatibilityMemory' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ProviderCompatibilityMemory.java
          grep -q 'transport=cronet-gms headers=parity' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackTransportFactory.java
          grep -q 'visionSteadyStateStall' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'visionVodSteadyStall' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'durationMs() < 1_000' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          ! grep -R -q 'stage7-visible-playback-status\|playbackStatusChip' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player
          grep -q 'versionCode = 1000365' BLOFY-ANDROID-2026/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v6
        with: {gradle-version: '8.13'}
      - name: Compile tests lint and APK
        working-directory: BLOFY-ANDROID-2026
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.13
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"
      - name: Restore stable BLOFY signing key
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V339_KEY_ARTIFACT_ID}/zip" -o "$RUNNER_TEMP/key.zip"
          mkdir -p "$RUNNER_TEMP/key"; unzip -q "$RUNNER_TEMP/key.zip" -d "$RUNNER_TEMP/key"
      - name: Sign and structural QA
        shell: bash
        run: |
          set -euo pipefail
          APK=BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk
          PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/key/BLOFY-PLAYER-STABLE-TEST.password.txt")"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key/BLOFY-PLAYER-STABLE-TEST.jks" --ks-key-alias blofy --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk "$APK"
          "$BT/apksigner" verify --verbose --print-certs BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk | tee /tmp/sig
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/sig
          "$BT/aapt" dump badging BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk | tee /tmp/badging
          grep -q "package: name='tv.blofy.player'" /tmp/badging
          grep -q "versionCode='1000365'" /tmp/badging
          unzip -t BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk >/tmp/ziptest
          grep -q 'No errors detected' /tmp/ziptest
          sha256sum BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk > BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BLOFY-v340-VISION-STABLE-PLAYBACK-V2-SIGNED
          path: |
            BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk
            BLOFY-PLAYER-v340-VISION-STABLE-PLAYBACK-V2-SIGNED.apk.sha256
          if-no-files-found: error
          retention-days: 14