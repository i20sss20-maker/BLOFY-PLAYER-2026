name: Build BLOFY v340 Full Stability R10

on:
  workflow_dispatch:
  push:
    branches: [v340-full-stability]
    paths:
      - "tools/apply_v340_r10_warning_hardening.py"
      - ".github/workflows/v340-full-stability-r10.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: blofy-v340-full-stability-r10
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b
      V339_KEY_ARTIFACT_ID: 9664972711
      EXPECTED_CERT_SHA256: f54493426cd16e2fc67390c307937d5d2bb04f81201f4bad3355ae66ff4813a6

    steps:
      - name: Checkout v340 branch
        uses: actions/checkout@v6

      - name: Recreate stable base and apply R10 hardening
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            apply_v329_hotfix.py \
            apply_v330_hotfix.py \
            apply_v330_vod_fix.py \
            apply_v330_compile_fix.py \
            apply_v331_precompat.py \
            apply_v331_transport_manager.py \
            apply_v331_compile_fix.py \
            apply_v333_full_engines.py \
            apply_v334_compat_engine.py \
            apply_v336_diagnostics_reset.py \
            apply_v337_vod_compat.py \
            apply_v339_stability.py \
            apply_v340_full2.py \
            apply_v340_perf.py \
            apply_v340_live_guard.py \
            apply_v340_compile_fix.py \
            apply_v340_session_guard.py \
            apply_v340_route_learning.py \
            apply_v340_final_foundation.py \
            apply_v340_final_core.py \
            apply_v340_source_probe.py \
            apply_v340_verified_gate_runner2.py \
            apply_v340_final_safety_r8.py \
            apply_v340_r9_deep_logic_fix.py \
            apply_v340_r10_warning_hardening.py; do
              python3 "tools/$f"
          done

          PACKAGE=BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PackageImporter.java
          PROFILE=BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ServerPlaybackProfile.java
          PLAYER=BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          VOD=BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          DATABASE=BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/CatalogDatabase.java
          GRADLE=BLOFY-ANDROID-2026/app/build.gradle.kts

          grep -q 'تم فتح النسخة المحفوظة على الجهاز بدون إعادة تحميل' "$PACKAGE"
          ! grep -q 'ServerCompatibilityPreflight.run(' "$PACKAGE"
          ! grep -q 'putBoolean(key + ".verified", false).remove(key + ".route")' "$PROFILE"
          grep -q 'rememberVerifiedSuccess' "$PROFILE"
          grep -q 'if (isLive()) { finish(); return true; }' "$PLAYER"
          grep -q 'rememberVerifiedSuccess' "$PLAYER"
          grep -q 'routeAllowed("direct")' "$VOD"
          grep -q 'routeAllowed("no-extension")' "$VOD"
          grep -q 'rejectVodRouteIfHard' "$VOD"
          grep -q 'media_staging' "$DATABASE"
          grep -q 'sync_state", "complete"' "$DATABASE"
          grep -q 'versionCode = 1000343' "$GRADLE"
          grep -q 'versionName = "v340-full-stability-r10"' "$GRADLE"
          grep -q 'keepDebugSymbols' "$GRADLE"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;3.31.4"

      - name: Build warning-clean Media3 FFmpeg decoder
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties
          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cd "$FFMPEG_MODULE_PATH/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1

          # Clang 18+ warns on FFmpeg 6.0's intentional INT64/UINT64 option bounds.
          # Suppress only that upstream diagnostic; do not suppress general warnings.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build_ffmpeg.sh')
          s = p.read_text()
          s = s.replace('--extra-cflags="-march=armv7-a -mfloat-abi=softfp"',
                        '--extra-cflags="-march=armv7-a -mfloat-abi=softfp -Wno-implicit-const-int-float-conversion"')
          for cpu in ('armv8-a', 'i686', 'x86-64'):
              needle = f'--cpu={cpu} \\\n'
              repl = needle + '    --extra-cflags="-Wno-implicit-const-int-float-conversion" \\\n'
              if needle not in s:
                  raise SystemExit(f'missing FFmpeg cpu anchor: {cpu}')
              s = s.replace(needle, repl, 1)
          p.write_text(s)
          PY

          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 "$ANDROID_ABI" vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca 2>&1 | tee "$RUNNER_TEMP/ffmpeg-build.log"
          if grep -q 'implicit conversion.*changes value' "$RUNNER_TEMP/ffmpeg-build.log"; then
            echo 'FFmpeg numeric conversion warning still present'; exit 1
          fi

          cd "$GITHUB_WORKSPACE/.media3"
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -path '*decoder_ffmpeg*' -print | head -n 1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Create Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests and lint
        working-directory: BLOFY-ANDROID-2026
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean testDebugUnitTest lintRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL" 2>&1 | tee "$RUNNER_TEMP/tests-lint.log"

      - name: Build release APK without native-strip warnings
        working-directory: BLOFY-ANDROID-2026
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL" 2>&1 | tee "$RUNNER_TEMP/release-build.log"
          if grep -q 'Unable to strip the following libraries' "$RUNNER_TEMP/release-build.log"; then
            echo 'Native strip warning still present'; exit 1
          fi

      - name: Restore exact external signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V339_KEY_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/v339-signing.zip"
          mkdir -p "$RUNNER_TEMP/v339-signing"
          unzip -q "$RUNNER_TEMP/v339-signing.zip" -d "$RUNNER_TEMP/v339-signing"
          test -s "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          test -s "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.password.txt"

      - name: Sign R10
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          KS="$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.password.txt")"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias blofy --ks-pass pass:"$PASS" --key-pass pass:"$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out BLOFY-PLAYER-v340-R10-FULL-STABILITY-SIGNED.apk "$APK"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "FINAL_APK=$GITHUB_WORKSPACE/BLOFY-PLAYER-v340-R10-FULL-STABILITY-SIGNED.apk" >> "$GITHUB_ENV"

      - name: Deep final APK QA and warning classification
        shell: bash
        run: |
          set -euo pipefail
          "$BT/apksigner" verify --verbose --print-certs "$FINAL_APK" > /tmp/signature.txt 2> /tmp/apksigner-stderr.txt
          cat /tmp/signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signature.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/signature.txt
          grep -q 'Number of signers: 1' /tmp/signature.txt

          # v1 JAR signing excludes META-INF metadata by specification. Because v2/v3
          # are also required above, these messages are informational. Fail on any
          # apksigner stderr that is NOT exactly this known class.
          if [ -s /tmp/apksigner-stderr.txt ]; then
            grep -vE '^WARNING: META-INF/.* not protected by signature\. Unauthorized modifications to this JAR entry will not be detected\. Delete or move the entry outside of META-INF/\.$' /tmp/apksigner-stderr.txt > /tmp/unexpected-signer.txt || true
            if [ -s /tmp/unexpected-signer.txt ]; then
              cat /tmp/unexpected-signer.txt; exit 1
            fi
          fi

          "$BT/zipalign" -c -v 4 "$FINAL_APK" >/tmp/zipalign.txt
          grep -Eq 'Verification success(fu|u)l' /tmp/zipalign.txt
          "$BT/aapt" dump badging "$FINAL_APK" | tee /tmp/badging.txt
          "$BT/aapt" dump permissions "$FINAL_APK" | tee /tmp/permissions.txt
          grep -q "package: name='tv.blofy.player' versionCode='1000343' versionName='v340-full-stability-r10'" /tmp/badging.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          grep -q "launchable-activity: name='tv.blofy.player.MainActivity'" /tmp/badging.txt
          grep -q "leanback-launchable-activity: name='tv.blofy.player.MainActivity'" /tmp/badging.txt
          grep -q "native-code:.*'arm64-v8a'" /tmp/badging.txt
          grep -q "native-code:.*'armeabi-v7a'" /tmp/badging.txt
          if grep -q "native-code:.*'x86'" /tmp/badging.txt; then exit 1; fi
          for p in CAMERA RECORD_AUDIO READ_CONTACTS WRITE_CONTACTS ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_SMS SEND_SMS RECEIVE_SMS READ_PHONE_STATE CALL_PHONE WRITE_EXTERNAL_STORAGE READ_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO; do
            if grep -q "android.permission.$p" /tmp/permissions.txt; then echo "Unexpected dangerous permission: $p"; exit 1; fi
          done
          unzip -t "$FINAL_APK" >/tmp/unzip.txt
          grep -q 'No errors detected' /tmp/unzip.txt

          python3 -c 'import collections,pathlib,sys,zipfile,hashlib,zlib,struct; z=zipfile.ZipFile(pathlib.Path(sys.argv[1])); assert z.testzip() is None; ns=z.namelist(); assert not [n for n,c in collections.Counter(ns).items() if c>1]; dex=[n for n in ns if n.startswith("classes") and n.endswith(".dex")]; assert dex; data=[z.read(n) for n in dex]; assert all(len(d)>112 and d[:4] in (b"dex\n",b"cdex") for d in data); req=["lib/arm64-v8a/libffmpegJNI.so","lib/arm64-v8a/libvlc.so","lib/arm64-v8a/libvlcjni.so","lib/arm64-v8a/libc++_shared.so","lib/armeabi-v7a/libffmpegJNI.so","lib/armeabi-v7a/libvlc.so","lib/armeabi-v7a/libvlcjni.so","lib/armeabi-v7a/libc++_shared.so"]; assert not [n for n in req if n not in ns]; abis={n.split("/")[1] for n in ns if n.startswith("lib/") and n.count("/")>=2}; assert abis=={"arm64-v8a","armeabi-v7a"}; print("R10 deep zip/dex/native QA OK",dex)' "$FINAL_APK"

          TMP="$RUNNER_TEMP/native-r10"
          mkdir -p "$TMP"
          unzip -q "$FINAL_APK" 'lib/*' -d "$TMP"
          for so in "$TMP"/lib/arm64-v8a/*.so; do readelf -h "$so" | grep -q 'Class:.*ELF64'; readelf -h "$so" | grep -q 'Machine:.*AArch64'; done
          for so in "$TMP"/lib/armeabi-v7a/*.so; do readelf -h "$so" | grep -q 'Class:.*ELF32'; readelf -h "$so" | grep -q 'Machine:.*ARM'; done
          sha256sum "$FINAL_APK" | tee BLOFY-PLAYER-v340-R10-FULL-STABILITY-SIGNED.apk.sha256

      - name: Upload signed R10 artifact
        uses: actions/upload-artifact@v6
        with:
          name: BLOFY-PLAYER-v340-R10-FULL-STABILITY-SIGNED
          path: |
            BLOFY-PLAYER-v340-R10-FULL-STABILITY-SIGNED.apk
            BLOFY-PLAYER-v340-R10-FULL-STABILITY-SIGNED.apk.sha256
          if-no-files-found: error
