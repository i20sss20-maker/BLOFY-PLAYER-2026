name: TEMP Dispatch Final BLOFY APK

# This helper must never run on a schedule or write status commits to main.
# Railway production is connected to main, so those CI-only commits caused
# repeated production redeploys and stopped the running backend container.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final full APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run full-player-apk.yml --ref main
