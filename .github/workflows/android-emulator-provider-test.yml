name: BLOFY Android Emulator Provider Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-emulator-provider-test.yml"
      - "BLOFY-ANDROID-COMMERCIAL/app/src/androidTest/**"
      - "BLOFY-ANDROID-COMMERCIAL/app/src/main/**"
      - "BLOFY-ANDROID-COMMERCIAL/app/build.gradle.kts"

concurrency:
  group: blofy-emulator-provider-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke-test:
    name: Provider Emulator — ${{ matrix.host_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - host_name: cf
            server_url: http://cf.business-cdn-8k.com
          - host_name: pro
            server_url: http://pro.business-cdn-8k.com
          - host_name: tv
            server_url: http://tv.business-cdn-8k.com
    env:
      BLOFY_TEST_USERNAME: ${{ secrets.BLOFY_TEST_USERNAME }}
      BLOFY_TEST_PASSWORD: ${{ secrets.BLOFY_TEST_PASSWORD }}
      BLOFY_TEST_SERVER_URL: ${{ matrix.server_url }}

    steps:
      - name: Checkout BLOFY
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate masked provider secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BLOFY_TEST_USERNAME:-}"
          test -n "${BLOFY_TEST_PASSWORD:-}"
          test -n "${BLOFY_TEST_SERVER_URL:-}"
          echo "Provider test secrets are configured for host ${{ matrix.host_name }}."

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run BLOFY on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash -lc 'mkdir -p emulator-artifacts/screenshots emulator-artifacts/test-results; adb logcat -c; adb shell settings put system user_rotation 1; adb shell settings put system accelerometer_rotation 0; set +e; gradle -p BLOFY-ANDROID-COMMERCIAL --no-daemon connectedDebugAndroidTest -PBLOFY_BASE_URL="https://blofy-player-2026-production.up.railway.app" -Pandroid.testInstrumentationRunnerArguments.class=tv.blofy.commercial.CommercialEmulatorSmokeTest -Pandroid.testInstrumentationRunnerArguments.providerKind=xtream -Pandroid.testInstrumentationRunnerArguments.serverUrl="$BLOFY_TEST_SERVER_URL" -Pandroid.testInstrumentationRunnerArguments.username="$BLOFY_TEST_USERNAME" -Pandroid.testInstrumentationRunnerArguments.password="$BLOFY_TEST_PASSWORD"; TEST_EXIT=$?; adb logcat -d -v threadtime > emulator-artifacts/logcat.txt 2>&1 || true; adb shell dumpsys activity activities > emulator-artifacts/activity-dump.txt 2>&1 || true; adb shell dumpsys package tv.blofy.player > emulator-artifacts/package-dump.txt 2>&1 || true; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true; adb pull /sdcard/window.xml emulator-artifacts/window.xml >/dev/null 2>&1 || true; adb pull /sdcard/Download/blofy-ci/. emulator-artifacts/screenshots/ >/dev/null 2>&1 || true; cp -R BLOFY-ANDROID-COMMERCIAL/app/build/outputs/androidTest-results/connected/. emulator-artifacts/test-results/ 2>/dev/null || true; cp -R BLOFY-ANDROID-COMMERCIAL/app/build/reports/androidTests/connected/. emulator-artifacts/test-results/ 2>/dev/null || true; echo "$TEST_EXIT" > emulator-artifacts/test-exit-code.txt; exit "$TEST_EXIT"'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-EMULATOR-EVIDENCE-${{ matrix.host_name }}
          path: emulator-artifacts/**
          if-no-files-found: warn
          retention-days: 7
