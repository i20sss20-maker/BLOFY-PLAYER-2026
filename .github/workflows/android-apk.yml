name: Build BLOFY PLAYER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "BLOFY-ANDROID-2026/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: blofy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify native metadata fix
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'void putMetadata(String key, String value)' \
            BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/CatalogDatabase.java
          ! grep -q 'void metadata(String key, String value)' \
            BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/CatalogDatabase.java

      - name: Create Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Run native unit tests
        working-directory: BLOFY-ANDROID-2026
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest \
            -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build native APK
        working-directory: BLOFY-ANDROID-2026
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Generate Android lint report
        continue-on-error: true
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon lintDebug

      - name: Prepare named APK
        run: |
          cp BLOFY-ANDROID-2026/app/build/outputs/apk/debug/app-debug.apk \
            BLOFY-PLAYER-2026-NATIVE.apk

      - name: Upload BLOFY PLAYER APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-NATIVE-APK
          path: BLOFY-PLAYER-2026-NATIVE.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-ANDROID-BUILD-REPORTS
          path: |
            BLOFY-ANDROID-2026/app/build/reports/**
            BLOFY-ANDROID-2026/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish native CI run pointer
        if: always()
        shell: bash
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "blofy-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .ci
          cat > .ci/native-apk-status.json <<EOF
          {
            "workflow": "Build BLOFY PLAYER APK",
            "status": "${CI_JOB_STATUS}",
            "run_id": ${CI_RUN_ID},
            "run_attempt": ${CI_RUN_ATTEMPT},
            "source_sha": "${CI_SOURCE_SHA}",
            "artifact": "BLOFY-PLAYER-NATIVE-APK",
            "version": "2026.08.23.7-7max-audit"
          }
          EOF
          git add .ci/native-apk-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record native APK build ${CI_RUN_ID}"
          git push origin main
