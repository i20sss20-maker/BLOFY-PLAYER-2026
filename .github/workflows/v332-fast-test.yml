name: BLOFY v332 FAST TEST

on:
  workflow_dispatch:
  push:
    branches: [v332-adaptive-playback-ui]
    paths:
      - ".github/workflows/v332-fast-test.yml"
      - "tools/apply_v332_adaptive.py"
      - "tools/apply_v332_controller_bridge.py"
      - "tools/apply_v332_ui.py"
      - "tools/apply_v332_error_guard.py"

permissions:
  contents: write

concurrency:
  group: blofy-v332-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
    steps:
      - name: Checkout v332
        uses: actions/checkout@v4

      - name: Apply v331 baseline + v332 patches
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v329_hotfix.py
          python3 tools/apply_v330_hotfix.py
          python3 tools/apply_v330_vod_fix.py
          python3 tools/apply_v330_compile_fix.py
          python3 tools/apply_v331_precompat.py
          python3 tools/apply_v331_transport_manager.py
          python3 tools/apply_v331_compile_fix.py
          python3 tools/apply_v332_adaptive.py
          python3 tools/apply_v332_controller_bridge.py
          python3 tools/apply_v332_ui.py
          python3 tools/apply_v332_error_guard.py
          grep -q 'versionCode = 332' BLOFY-ANDROID-2026/app/build.gradle.kts
          grep -q 'AdaptivePlaybackController' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'تشخيص التشغيل المتقدم' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SettingsActivity.java
          grep -q 'جاري المحاولة' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Create wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon testDebugUnitTest -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build release APK
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Sign test APK
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          keytool -genkeypair -v -keystore /tmp/blofy-v332-fast.jks -storepass blofy332fast -keypass blofy332fast -alias blofy-v332-fast -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=BLOFY PLAYER v332 Fast Test, O=BLOFY, C=SA'
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" /tmp/BLOFY-PLAYER-v332-FAST-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/blofy-v332-fast.jks --ks-pass pass:blofy332fast --key-pass pass:blofy332fast --ks-key-alias blofy-v332-fast --out BLOFY-PLAYER-v332-FAST-TEST-SIGNED.apk /tmp/BLOFY-PLAYER-v332-FAST-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs BLOFY-PLAYER-v332-FAST-TEST-SIGNED.apk
          sha256sum BLOFY-PLAYER-v332-FAST-TEST-SIGNED.apk > BLOFY-PLAYER-v332-FAST-TEST-SIGNED.apk.sha256

      - name: Publish fast test
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v332-fast-${GITHUB_SHA:0:12}"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" --target "$GITHUB_SHA" --title 'BLOFY PLAYER v332 FAST TEST' --notes 'Fast signed test build using Media3 + Cronet + LibVLC. FFmpeg extension is omitted only from this fast validation build.' --prerelease BLOFY-PLAYER-v332-FAST-TEST-SIGNED.apk BLOFY-PLAYER-v332-FAST-TEST-SIGNED.apk.sha256
