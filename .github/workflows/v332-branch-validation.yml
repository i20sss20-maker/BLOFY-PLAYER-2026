name: Validate BLOFY v332 Branch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v332-branch-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b
    steps:
      - name: Checkout isolated v332 branch
        uses: actions/checkout@v4
        with:
          ref: v332-adaptive-playback-ui

      - name: Apply stable baseline plus v332 development
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v329_hotfix.py
          python3 tools/apply_v330_hotfix.py
          python3 tools/apply_v330_vod_fix.py
          python3 tools/apply_v330_compile_fix.py
          python3 tools/apply_v331_precompat.py
          python3 tools/apply_v331_transport_manager.py
          python3 tools/apply_v331_compile_fix.py
          python3 tools/apply_v332_adaptive.py
          grep -q 'versionCode = 332' BLOFY-ANDROID-2026/app/build.gradle.kts
          grep -q 'PlaybackDiagnostics.record' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'PlaybackDiagnosticsActivity' BLOFY-ANDROID-2026/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;3.31.4"

      - name: Build Media3 FFmpeg decoder
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties
          MODULE="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cd "$MODULE/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh "$MODULE" "$NDK" linux-x86_64 "$ANDROID_ABI" vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca
          cd "$GITHUB_WORKSPACE/.media3"
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -path '*decoder_ffmpeg*' -print | head -n1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Create Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon clean testDebugUnitTest -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Compile release APK
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Lint
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon lintRelease

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'libffmpegJNI.so'
          echo "v332 branch validation passed"
