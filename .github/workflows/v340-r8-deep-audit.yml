name: Build BLOFY v340 R8 Deep Audit

on:
  workflow_dispatch:
  push:
    branches: [v340-full-stability]
    paths:
      - "tools/apply_v340_deep_audit_fix.py"
      - ".github/workflows/v340-r8-deep-audit.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: blofy-v340-r8-deep-audit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b
      V339_KEY_ARTIFACT_ID: 9664972711

    steps:
      - name: Checkout v340 branch
        uses: actions/checkout@v4

      - name: Recreate v340 and apply R8 deep-audit corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v329_hotfix.py
          python3 tools/apply_v330_hotfix.py
          python3 tools/apply_v330_vod_fix.py
          python3 tools/apply_v330_compile_fix.py
          python3 tools/apply_v331_precompat.py
          python3 tools/apply_v331_transport_manager.py
          python3 tools/apply_v331_compile_fix.py
          python3 tools/apply_v333_full_engines.py
          python3 tools/apply_v334_compat_engine.py
          python3 tools/apply_v336_diagnostics_reset.py
          python3 tools/apply_v337_vod_compat.py
          python3 tools/apply_v339_stability.py
          python3 tools/apply_v340_full2.py
          python3 tools/apply_v340_perf.py
          python3 tools/apply_v340_live_guard.py
          python3 tools/apply_v340_compile_fix.py
          python3 tools/apply_v340_session_guard.py
          python3 tools/apply_v340_route_learning.py
          python3 tools/apply_v340_final_foundation.py
          python3 tools/apply_v340_final_core.py
          python3 tools/apply_v340_source_probe.py
          python3 tools/apply_v340_verified_gate_runner2.py
          python3 tools/apply_v340_deep_audit_fix.py
          grep -q 'not-blocking' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PackageImporter.java
          grep -q 'rejectItemRoute' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ServerPlaybackProfile.java
          grep -q 'itemRouteRejected' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'versionCode = 1000341' BLOFY-ANDROID-2026/app/build.gradle.kts
          grep -q 'versionName = "v340-full-stability-r8"' BLOFY-ANDROID-2026/app/build.gradle.kts

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;3.31.4"

      - name: Build Media3 FFmpeg decoder
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties
          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cd "$FFMPEG_MODULE_PATH/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 "$ANDROID_ABI" vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca
          cd "$GITHUB_WORKSPACE/.media3"
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -path '*decoder_ffmpeg*' -print | head -n 1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Create Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon clean testDebugUnitTest -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build release APK
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Restore exact v339 external signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V339_KEY_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/v339-signing.zip"
          mkdir -p "$RUNNER_TEMP/v339-signing"
          unzip -q "$RUNNER_TEMP/v339-signing.zip" -d "$RUNNER_TEMP/v339-signing"
          test -s "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          test -s "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.password.txt"

      - name: Sign and deep static QA
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          KS="$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.password.txt")"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          AAPT="$BUILD_TOOLS/aapt"
          OUT="BLOFY-PLAYER-v340-R8-DEEP-AUDIT-SIGNED.apk"
          test -s "$APK"
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias blofy \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$OUT" | tee /tmp/signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/signature.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signature.txt
          "$ZIPALIGN" -c -v 4 "$OUT" > /tmp/align.txt
          "$AAPT" dump badging "$OUT" | tee /tmp/badging.txt
          grep -q "package: name='tv.blofy.player' versionCode='1000341' versionName='v340-full-stability-r8'" /tmp/badging.txt
          grep -q "launchable-activity: name='tv.blofy.player.MainActivity'" /tmp/badging.txt
          grep -q "leanback-launchable-activity: name='tv.blofy.player.MainActivity'" /tmp/badging.txt
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" /tmp/badging.txt
          unzip -t "$OUT" > /tmp/ziptest.txt
          grep -q 'No errors detected' /tmp/ziptest.txt
          unzip -l "$OUT" > /tmp/list.txt
          grep -q 'lib/arm64-v8a/libffmpegJNI.so' /tmp/list.txt
          grep -q 'lib/arm64-v8a/libvlcjni.so' /tmp/list.txt
          grep -q 'lib/armeabi-v7a/libffmpegJNI.so' /tmp/list.txt
          grep -q 'lib/armeabi-v7a/libvlcjni.so' /tmp/list.txt
          python3 - "$OUT" <<'PY'
          import collections, pathlib, sys, zipfile
          apk=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              names=z.namelist()
              assert not [n for n,c in collections.Counter(names).items() if c>1]
              assert not [n for n in names if n.startswith('/') or '..' in pathlib.PurePosixPath(n).parts]
              dex=[n for n in names if n.startswith('classes') and n.endswith('.dex')]
              assert dex
              for n in dex: assert z.read(n)[:4] == b'dex\n'
          print('deep-zip-dex-qa=ok')
          PY
          sha256sum "$OUT" > "$OUT.sha256"

      - name: Upload signed R8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-v340-R8-DEEP-AUDIT-SIGNED
          path: |
            BLOFY-PLAYER-v340-R8-DEEP-AUDIT-SIGNED.apk
            BLOFY-PLAYER-v340-R8-DEEP-AUDIT-SIGNED.apk.sha256
          if-no-files-found: error
