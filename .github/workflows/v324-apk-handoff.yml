name: Prepare v329 APK handoff
# One-time private signing handoff for the CI-verified v329 Android package.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v324-apk-handoff.yml"

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and split the verified unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/v329-release /tmp/v329-handoff
          gh release download v329-build-922a6fa7702a \
            --pattern 'BLOFY-PLAYER-2026-RELEASE-UNSIGNED.apk' \
            --dir /tmp/v329-release
          APK=/tmp/v329-release/BLOFY-PLAYER-2026-RELEASE-UNSIGNED.apk
          test -s "$APK"
          zip -9 -j /tmp/BLOFY-PLAYER-v329-UNSIGNED.zip "$APK"
          base64 -w 2000000 /tmp/BLOFY-PLAYER-v329-UNSIGNED.zip \
            | split -d -a 3 -l 1 - /tmp/v329-handoff/chunk-
          {
            printf 'apk_sha256='; sha256sum "$APK" | cut -d' ' -f1
            printf 'apk_size='; stat -c '%s' "$APK"
            printf 'zip_sha256='; sha256sum /tmp/BLOFY-PLAYER-v329-UNSIGNED.zip | cut -d' ' -f1
            printf 'zip_size='; stat -c '%s' /tmp/BLOFY-PLAYER-v329-UNSIGNED.zip
            printf 'chunk_count='; find /tmp/v329-handoff -name 'chunk-*' -type f | wc -l
          } > /tmp/v329-handoff/manifest.txt

      - name: Publish private handoff branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name blofy-ci
          git config user.email actions@users.noreply.github.com
          git checkout --orphan v329-apk-handoff
          git rm -rf .
          mkdir -p v329-handoff
          cp /tmp/v329-handoff/* v329-handoff/
          git add v329-handoff
          git commit -m 'ci: prepare v329 unsigned APK handoff'
          git push --force origin HEAD:refs/heads/v329-apk-handoff
