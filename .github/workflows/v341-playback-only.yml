name: Build BLOFY v341 Playback Only

on:
  workflow_dispatch:
  push:
    branches: [v341-playback-only]
    paths:
      - "tools/apply_v341_playback_only.py"
      - "tools/check_v341_ui_freeze.py"
      - ".github/workflows/v341-playback-only.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: blofy-v341-playback-only
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b
      V339_KEY_ARTIFACT_ID: 9664972711
      EXPECTED_SIGNING_CERT_SHA256: f54493426cd16e2fc67390c307937d5d2bb04f81201f4bad3355ae66ff4813a6

    steps:
      - name: Checkout v341 source
        uses: actions/checkout@v4

      - name: Recreate v340 then apply playback-only v341
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v329_hotfix.py
          python3 tools/apply_v330_hotfix.py
          python3 tools/apply_v330_vod_fix.py
          python3 tools/apply_v330_compile_fix.py
          python3 tools/apply_v331_precompat.py
          python3 tools/apply_v331_transport_manager.py
          python3 tools/apply_v331_compile_fix.py
          python3 tools/apply_v333_full_engines.py
          python3 tools/apply_v334_compat_engine.py
          python3 tools/apply_v336_diagnostics_reset.py
          python3 tools/apply_v337_vod_compat.py
          python3 tools/apply_v339_stability.py
          python3 tools/apply_v340_full2.py
          python3 tools/apply_v340_perf.py
          python3 tools/apply_v340_live_guard.py
          python3 tools/apply_v340_compile_fix.py
          python3 tools/apply_v340_session_guard.py
          grep -q 'PlaybackDiagnostics' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'ServerPlaybackProfile' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'CatalogUiCache.categoryPage' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SevenMaxActivity.java
          grep -q 'liveStallWatchdog' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'live-switch-cancel' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'final List<BlofyModels.Media> delivered = next' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SevenMaxActivity.java
          grep -q 'stale-timeout-ignored' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'stale-resolve-ignored' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          python3 tools/apply_v341_playback_only.py
          python3 tools/check_v341_ui_freeze.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;3.31.4"

      - name: Build Media3 FFmpeg decoder
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties
          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cd "$FFMPEG_MODULE_PATH/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 "$ANDROID_ABI" vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca
          cd "$GITHUB_WORKSPACE/.media3"
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -path '*decoder_ffmpeg*' -print | head -n 1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Create Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon clean testDebugUnitTest -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Android lint
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon lintDebug -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build release APK
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Restore exact v340 signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V339_KEY_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/v340-signing.zip"
          mkdir -p "$RUNNER_TEMP/v340-signing"
          unzip -q "$RUNNER_TEMP/v340-signing.zip" -d "$RUNNER_TEMP/v340-signing"
          test -s "$RUNNER_TEMP/v340-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          test -s "$RUNNER_TEMP/v340-signing/BLOFY-PLAYER-STABLE-TEST.password.txt"

      - name: Sign and verify v341 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          KS="$RUNNER_TEMP/v340-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/v340-signing/BLOFY-PLAYER-STABLE-TEST.password.txt")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          OUTPUT="BLOFY-PLAYER-v341-PLAYBACK-ONLY-SIGNED.apk"
          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias blofy \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUTPUT" \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT" | tee "$RUNNER_TEMP/v341-cert.txt"
          grep -qi "$EXPECTED_SIGNING_CERT_SHA256" "$RUNNER_TEMP/v341-cert.txt"
          unzip -t "$OUTPUT"
          unzip -Z1 "$OUTPUT" > "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/arm64-v8a/libffmpegJNI.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/armeabi-v7a/libffmpegJNI.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/arm64-v8a/libvlc.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/armeabi-v7a/libvlc.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/arm64-v8a/libvlcjni.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/armeabi-v7a/libvlcjni.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/arm64-v8a/libc++_shared.so' "$RUNNER_TEMP/v341-apk-list.txt"
          grep -qx 'lib/armeabi-v7a/libc++_shared.so' "$RUNNER_TEMP/v341-apk-list.txt"
          test "$(awk -F/ '/^lib\/[^/]+\/[^/]+\.so$/ { print $2 }' "$RUNNER_TEMP/v341-apk-list.txt" | sort -u | paste -sd ' ' -)" = "arm64-v8a armeabi-v7a"
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload signed v341 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-v341-PLAYBACK-ONLY-SIGNED
          path: |
            BLOFY-PLAYER-v341-PLAYBACK-ONLY-SIGNED.apk
            BLOFY-PLAYER-v341-PLAYBACK-ONLY-SIGNED.apk.sha256
          if-no-files-found: error
