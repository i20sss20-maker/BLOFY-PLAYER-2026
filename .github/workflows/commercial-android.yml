name: Validate BLOFY Commercial Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "BLOFY-ANDROID-COMMERCIAL/**"
      - ".github/workflows/commercial-android.yml"

concurrency:
  group: blofy-commercial-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commercial-release-validation:
    name: Commercial Release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test BLOFY service contracts
        working-directory: BLOFY-WEB-2026/web-test
        run: |
          node --check server.mjs
          node --test --test-concurrency=1 test/*.test.mjs
      - name: Verify commercial source
        run: |
          test -f BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/player/PlayerActivity.java
          ! grep -R "android.webkit.WebView" BLOFY-ANDROID-COMMERCIAL/app/src/main/java
          grep -R "androidx.media3" BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/player
      - name: Validate release build
        working-directory: BLOFY-ANDROID-COMMERCIAL
        env:
          BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
        run: gradle --no-daemon clean testReleaseUnitTest lintRelease assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"
      - name: Upload unsigned release for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-UNSIGNED-COMMERCIAL-RELEASE
          path: BLOFY-ANDROID-COMMERCIAL/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Note production signing policy
        run: |
          echo "Production signing key is intentionally NOT stored in CI."
          echo "Offline signing must use the existing BLOFY production keystore backup."
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-COMMERCIAL-RELEASE-REPORTS
          path: |
            BLOFY-ANDROID-COMMERCIAL/app/build/reports/**
            BLOFY-ANDROID-COMMERCIAL/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
