name: Build BLOFY FULL Player APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "BLOFY-ANDROID-2026/**"
      - ".github/workflows/full-player-apk.yml"
      - "tools/apply_sync_fix.py"
      - "tools/apply_7max_ui.py"
      - "tools/apply_final_stabilization.py"
      - "tools/apply_final_tv_theme.py"
      - "tools/apply_lint_fixes.py"
      - "tools/apply_runtime_overhaul.py"

permissions:
  contents: write

concurrency:
  group: blofy-full-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-apk:
    name: Final TV + Media3 + Cronet + FFmpeg Audio
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b

    steps:
      - name: Checkout BLOFY
        uses: actions/checkout@v4

      - name: Apply final BLOFY code passes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_sync_fix.py
          python3 tools/apply_7max_ui.py
          python3 tools/apply_final_stabilization.py
          python3 tools/apply_final_tv_theme.py
          python3 tools/apply_lint_fixes.py
          grep -q '2026.08.23.12-final-tv' BLOFY-ANDROID-2026/app/build.gradle.kts
          grep -q 'BLOFY LIVE' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q '24_000' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'OnBackPressedDispatcher' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q '@OptIn(markerClass = UnstableApi.class)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'LivePreviewController' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SevenMaxActivity.java
          grep -q 'sort_order ASC' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/CatalogDatabase.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;3.31.4"
          test -d "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"

      - name: Checkout exact Media3 1.11.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          grep -R '1.11.0' .media3/RELEASENOTES.md >/dev/null
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties

      - name: Build FFmpeg audio libraries
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          HOST_PLATFORM="linux-x86_64"
          ENABLED_DECODERS=(vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca)

          cd "$FFMPEG_MODULE_PATH/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh \
            "$FFMPEG_MODULE_PATH" \
            "$NDK_PATH" \
            "$HOST_PLATFORM" \
            "$ANDROID_ABI" \
            "${ENABLED_DECODERS[@]}"

      - name: Assemble Media3 FFmpeg decoder AAR
        shell: bash
        working-directory: .media3
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -path '*decoder_ffmpeg*' -print | head -n 1)"
          if [ -z "$AAR" ]; then
            echo 'FFmpeg AAR not found; showing candidate AARs:'
            find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -print | head -n 100
            exit 1
          fi
          echo "Using FFmpeg AAR: $AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"
          ls -lh "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Verify FFmpeg decoder contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -l BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar | tee /tmp/ffmpeg-aar.txt
          grep -q 'libffmpegJNI.so' /tmp/ffmpeg-aar.txt

      - name: Create BLOFY Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Run BLOFY unit tests
        working-directory: BLOFY-ANDROID-2026
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest \
            -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build full BLOFY APK
        working-directory: BLOFY-ANDROID-2026
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Run Android lint
        working-directory: BLOFY-ANDROID-2026
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon lintDebug
          rc=$?
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          echo "===== FULL ANDROID LINT REPORT ====="
          if [ -f "$REPORT" ]; then
            cat "$REPORT"
          else
            echo "Lint text report not found at $REPORT"
          fi
          echo "===== END FULL ANDROID LINT REPORT ====="
          exit $rc

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'libffmpegJNI.so' /tmp/apk-list.txt
          cp "$APK" BLOFY-PLAYER-2026-FINAL-TV-FFMPEG.apk
          sha256sum BLOFY-PLAYER-2026-FINAL-TV-FFMPEG.apk > BLOFY-PLAYER-2026-FINAL-TV-FFMPEG.apk.sha256

      - name: Upload final full APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-FINAL-TV-FFMPEG-APK
          path: |
            BLOFY-PLAYER-2026-FINAL-TV-FFMPEG.apk
            BLOFY-PLAYER-2026-FINAL-TV-FFMPEG.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload FFmpeg AAR for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-MEDIA3-FFMPEG-AAR
          path: BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish CI run pointer
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          CI_JOB_STATUS: ${{ job.status }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "blofy-ci"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .ci
          cat > .ci/full-player-status.json <<EOF
          {
            "workflow": "Build BLOFY FULL Player APK",
            "status": "${CI_JOB_STATUS}",
            "run_id": ${CI_RUN_ID},
            "run_attempt": ${CI_RUN_ATTEMPT},
            "source_sha": "${CI_SOURCE_SHA}",
            "artifact": "BLOFY-PLAYER-FINAL-TV-FFMPEG-APK",
            "version": "2026.08.24.1-runtime-overhaul"
          }
          EOF
          git add .ci/full-player-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: record full player build ${CI_RUN_ID}"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main && break
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 2))
          done
