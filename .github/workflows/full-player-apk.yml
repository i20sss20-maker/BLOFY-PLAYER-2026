name: Build BLOFY FULL Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "BLOFY-ANDROID-2026/**"
      - ".github/workflows/full-player-apk.yml"

permissions:
  contents: read

concurrency:
  group: blofy-full-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-apk:
    name: 7Max-style Media3 + Cronet + FFmpeg Audio
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b

    steps:
      - name: Checkout BLOFY
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;3.31.4"

      - name: Checkout exact Media3 1.11.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          grep -R '1.11.0' .media3/RELEASENOTES.md >/dev/null
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties

      - name: Build FFmpeg audio libraries
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          HOST_PLATFORM="linux-x86_64"
          ENABLED_DECODERS=(vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca)

          cd "$FFMPEG_MODULE_PATH/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh \
            "$FFMPEG_MODULE_PATH" \
            "$NDK_PATH" \
            "$HOST_PLATFORM" \
            "$ANDROID_ABI" \
            "${ENABLED_DECODERS[@]}"

      - name: Assemble Media3 FFmpeg decoder AAR
        shell: bash
        working-directory: .media3
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find libraries/decoder_ffmpeg/build/outputs/aar -maxdepth 1 -name '*release*.aar' -print -quit)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"
          ls -lh "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Verify FFmpeg decoder contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -l BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar | tee /tmp/ffmpeg-aar.txt
          grep -q 'libffmpegJNI.so' /tmp/ffmpeg-aar.txt

      - name: Create BLOFY Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Run BLOFY unit tests
        working-directory: BLOFY-ANDROID-2026
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest \
            -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build full BLOFY APK
        working-directory: BLOFY-ANDROID-2026
        run: |
          ./gradlew --no-daemon assembleDebug \
            -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Verify APK contains FFmpeg extension
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'libffmpegJNI.so' /tmp/apk-list.txt
          cp "$APK" BLOFY-PLAYER-2026-7MAX-FULL.apk
          sha256sum BLOFY-PLAYER-2026-7MAX-FULL.apk > BLOFY-PLAYER-2026-7MAX-FULL.apk.sha256

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-7MAX-FULL-APK
          path: |
            BLOFY-PLAYER-2026-7MAX-FULL.apk
            BLOFY-PLAYER-2026-7MAX-FULL.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload FFmpeg AAR for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-MEDIA3-FFMPEG-AAR
          path: BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar
          if-no-files-found: ignore
          retention-days: 7
