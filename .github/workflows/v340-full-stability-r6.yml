name: Build BLOFY v340 Full Stability R6

on:
  workflow_dispatch:
  push:
    branches: [v340-full-stability]
    paths:
      - "tools/apply_v340_compile_fix.py"
      - "tools/apply_v340_session_guard.py"
      - "tools/apply_v340_route_learning.py"
      - "tools/apply_v340_final_foundation.py"
      - "tools/apply_v340_final_core.py"
      - "tools/apply_v340_source_probe.py"
      - "tools/apply_v340_verified_gate.py"
      - "tools/apply_v340_verified_gate_runner.py"
      - "BLOFY-ANDROID-2026/app/src/test/java/tv/blofy/player/PlaybackPolicyTest.java"
      - ".github/workflows/v340-full-stability-r6.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: blofy-v340-full-stability-r6
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BLOFY_BASE_URL: https://blofy-player-2026-production.up.railway.app
      ANDROID_NDK_VERSION: 26.1.10909125
      ANDROID_ABI: 23
      MEDIA3_COMMIT: e156aec119c304d3de70a2fa69e08dc585b9d92b
      V339_KEY_ARTIFACT_ID: 9664972711

    steps:
      - name: Checkout v340 branch
        uses: actions/checkout@v4

      - name: Recreate v339 then apply full v340 stack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v329_hotfix.py
          python3 tools/apply_v330_hotfix.py
          python3 tools/apply_v330_vod_fix.py
          python3 tools/apply_v330_compile_fix.py
          python3 tools/apply_v331_precompat.py
          python3 tools/apply_v331_transport_manager.py
          python3 tools/apply_v331_compile_fix.py
          python3 tools/apply_v333_full_engines.py
          python3 tools/apply_v334_compat_engine.py
          python3 tools/apply_v336_diagnostics_reset.py
          python3 tools/apply_v337_vod_compat.py
          python3 tools/apply_v339_stability.py
          python3 tools/apply_v340_full2.py
          python3 tools/apply_v340_perf.py
          python3 tools/apply_v340_live_guard.py
          python3 tools/apply_v340_compile_fix.py
          python3 tools/apply_v340_session_guard.py
          python3 tools/apply_v340_route_learning.py
          python3 tools/apply_v340_final_foundation.py
          python3 tools/apply_v340_final_core.py
          python3 tools/apply_v340_source_probe.py
          python3 tools/apply_v340_verified_gate_runner.py
          grep -q 'PlaybackDiagnostics' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'blofy_server_playback_profiles_v2' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ServerPlaybackProfile.java
          grep -q 'rememberVerifiedSuccess' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ServerPlaybackProfile.java
          grep -q 'CatalogUiCache.categoryPage' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SevenMaxActivity.java
          grep -q 'liveStallWatchdog' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'stale-timeout-ignored' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'stale-resolve-ignored' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'readableReport' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackDiagnostics.java
          grep -q 'showDiagnosticsReport' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/SettingsActivity.java
          grep -q 'rule=3-of-3 required' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ServerCompatibilityPreflight.java
          grep -q 'MediaExtractor' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/ServerCompatibilityPreflight.java
          grep -q 'cachedGate.accepted' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PackageImporter.java
          grep -q '!preflight.accepted' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PackageImporter.java
          grep -q 'if (isLive()) { finish(); return true; }' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlayerActivity.java
          grep -q 'postDelayed(pending, 380L)' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/LivePreviewController.java
          grep -q 'routeAllowed("direct")' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'routeAllowed("no-extension")' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/VodPlayerActivity.java
          grep -q 'isHardRouteFailure' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/PlaybackPolicy.java
          grep -q 'showImportDiagnostics' BLOFY-ANDROID-2026/app/src/main/java/tv/blofy/player/MainActivity.java

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" "cmake;3.31.4"

      - name: Build Media3 FFmpeg decoder
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/androidx/media.git .media3
          git -C .media3 checkout "$MEDIA3_COMMIT"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > .media3/local.properties
          FFMPEG_MODULE_PATH="$GITHUB_WORKSPACE/.media3/libraries/decoder_ffmpeg/src/main"
          NDK_PATH="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          cd "$FFMPEG_MODULE_PATH/jni"
          git clone https://git.ffmpeg.org/ffmpeg.git ffmpeg --branch release/6.0 --depth=1
          chmod +x build_ffmpeg.sh
          ./build_ffmpeg.sh "$FFMPEG_MODULE_PATH" "$NDK_PATH" linux-x86_64 "$ANDROID_ABI" vorbis opus flac alac mp3 amrnb amrwb aac ac3 eac3 dca
          cd "$GITHUB_WORKSPACE/.media3"
          ./gradlew --no-daemon :lib-decoder-ffmpeg:assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs"
          AAR="$(find "$GITHUB_WORKSPACE/.media3" -type f -name '*.aar' -path '*decoder_ffmpeg*' -print | head -n 1)"
          test -n "$AAR"
          cp "$AAR" "$GITHUB_WORKSPACE/BLOFY-ANDROID-2026/app/libs/media3-decoder-ffmpeg-release.aar"

      - name: Create Gradle wrapper
        working-directory: BLOFY-ANDROID-2026
        run: gradle wrapper --gradle-version 8.13

      - name: Unit tests
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon clean testDebugUnitTest -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Build release APK
        working-directory: BLOFY-ANDROID-2026
        run: ./gradlew --no-daemon assembleRelease -PBLOFY_BASE_URL="$BLOFY_BASE_URL"

      - name: Restore exact v339 external signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V339_KEY_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/v339-signing.zip"
          mkdir -p "$RUNNER_TEMP/v339-signing"
          unzip -q "$RUNNER_TEMP/v339-signing.zip" -d "$RUNNER_TEMP/v339-signing"
          test -s "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          test -s "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.password.txt"

      - name: Sign v340 with exact v339 external key
        shell: bash
        run: |
          set -euo pipefail
          APK="BLOFY-ANDROID-2026/app/build/outputs/apk/release/app-release-unsigned.apk"
          KS="$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.jks"
          PASS="$(tr -d '\r\n' < "$RUNNER_TEMP/v339-signing/BLOFY-PLAYER-STABLE-TEST.password.txt")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$KS" \
            --ks-key-alias blofy \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk | tee /tmp/v340-cert.txt
          unzip -t BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk
          unzip -l BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk > /tmp/apk-list.txt
          grep -q 'libffmpegJNI.so' /tmp/apk-list.txt
          sha256sum BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk > BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk.sha256

      - name: Upload signed v340 artifact
        uses: actions/upload-artifact@v4
        with:
          name: BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED
          path: |
            BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk
            BLOFY-PLAYER-v340-R6-FULL-STABILITY-SIGNED.apk.sha256
          if-no-files-found: error
