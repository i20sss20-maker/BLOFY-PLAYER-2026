name: Patch BLOFY control plane v18

on:
  push:
    branches: [fix/direct-provider-playback]
    paths: ['.github/workflows/patch-control-plane-v18.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/direct-provider-playback
      - name: Patch activation control plane
        shell: python
        run: |
          from pathlib import Path
          p = Path('BLOFY-WEB-2026/web-test/server.mjs')
          s = p.read_text()
          old = '''    let license;\n    if (String(body.code || "").trim()) license = await licenses.redeem(deviceId, body.code);\n    else license = await licenses.get(deviceId, { create: false });\n    if (!license || !["trial", "active"].includes(license.plan)) {\n      return json(res, 402, { error: "أدخل رمز تفعيل رقمي صالح أولًا." }, securityHeaders());\n    }\n'''
          new = '''    // Device pairing/configuration no longer uses activation codes.\n    // Licensing is controlled separately by device id / payment status.\n    const license = await licenses.get(deviceId);\n'''
          if old not in s:
              raise SystemExit('configure activation-code block not found')
          s = s.replace(old, new, 1)
          old2 = '''    return json(res, 200, { ok: true, configured: true, license, session: publicSession(session) }, {\n'''
          new2 = '''    const profile = session.kind === "xtream"\n      ? { kind: "xtream", name: session.name || "Xtream Codes", serverUrl: session.serverUrl || "", username: session.username || "", password: session.password || "" }\n      : { kind: "m3u", name: session.name || "M3U / M3U8", url: session.url || "" };\n    return json(res, 200, { ok: true, configured: true, license, session: publicSession(session), profile }, {\n'''
          if old2 not in s:
              raise SystemExit('bootstrap response block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "blofy-ci"
          git config user.email "actions@users.noreply.github.com"
          git add BLOFY-WEB-2026/web-test/server.mjs
          git commit -m "Remove activation code from device pairing and expose paired profile" || exit 0
          git push origin HEAD:fix/direct-provider-playback
