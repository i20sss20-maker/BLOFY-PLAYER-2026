name: Patch BLOFY v21

on:
  push:
    branches: [blofy-commercial-v20]
    paths: ['.github/workflows/patch-v21.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blofy-commercial-v20
      - name: Patch v21
        shell: python
        run: |
          from pathlib import Path

          # 1) Xtream: expose a standard get.php playlist fallback.
          p = Path('BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/provider/XtreamClient.java')
          s = p.read_text()
          needle = '    public String serverName() { return profile.name.isEmpty() ? profile.serverUrl : profile.name; }\n    public String workingUserAgent() { return workingUserAgent; }\n'
          repl = '''    public String serverName() { return profile.name.isEmpty() ? profile.serverUrl : profile.name; }\n\n    /** Standard Xtream M3U endpoint used when a provider blocks player_api.php. */\n    public ProviderProfile playlistFallbackProfile() {\n        HttpUrl base = HttpUrl.parse(profile.serverUrl + "/get.php");\n        if (base == null) throw new IllegalArgumentException("رابط Xtream غير صالح.");\n        String url = base.newBuilder()\n                .addQueryParameter("username", profile.username)\n                .addQueryParameter("password", profile.password)\n                .addQueryParameter("type", "m3u_plus")\n                .addQueryParameter("output", "ts")\n                .build().toString();\n        return new ProviderProfile("m3u", profile.name, "", "", "", url);\n    }\n\n    public String workingUserAgent() { return workingUserAgent; }\n'''
          if needle not in s: raise SystemExit('Xtream serverName anchor missing')
          p.write_text(s.replace(needle, repl, 1))

          # 2) Login: save immediately; provider validation belongs to sync/fallback, not the form.
          p = Path('BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/activation/ActivationActivity.java')
          s = p.read_text()
          old = '                if (profile.isXtream()) new XtreamClient(profile).validate();\n                ProviderProfileStore.save(this, profile);\n'
          new = '                ProviderProfileStore.save(this, profile);\n'
          if old not in s: raise SystemExit('Activation validation anchor missing')
          p.write_text(s.replace(old, new, 1))

          # 3) Sync: API first; if 403, use the same account through standard get.php/M3U.
          p = Path('BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/sync/SyncActivity.java')
          s = p.read_text()
          old = '''    private void syncXtream(ProviderProfile profile) throws Exception {\n        XtreamClient client = new XtreamClient(profile);\n        emit(8);\n        client.validate();\n        importXtreamType(client, "live", 12, 42);\n        importXtreamType(client, "movies", 42, 70);\n        importXtreamType(client, "series", 70, 94);\n    }\n'''
          new = '''    private void syncXtream(ProviderProfile profile) throws Exception {\n        XtreamClient client = new XtreamClient(profile);\n        emit(8);\n        try {\n            client.validate();\n            importXtreamType(client, "live", 12, 42);\n            importXtreamType(client, "movies", 42, 70);\n            importXtreamType(client, "series", 70, 94);\n        } catch (Exception apiError) {\n            String message = apiError.getMessage() == null ? "" : apiError.getMessage();\n            if (!message.contains("HTTP 403")) throw apiError;\n            Log.w(TAG, "Xtream API blocked with 403; switching to get.php/M3U fallback");\n            store.clearCatalog();\n            store.putMeta("kind", "m3u");\n            store.putMeta("server", (profile.name.isEmpty() ? profile.serverUrl : profile.name) + " • M3U fallback");\n            emit(10);\n            syncM3u(client.playlistFallbackProfile());\n        }\n    }\n'''
          if old not in s: raise SystemExit('Sync Xtream anchor missing')
          p.write_text(s.replace(old, new, 1))

          # 4) Player: M3U fallback items already contain their final provider URL.
          p = Path('BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/player/PlayerActivity.java')
          s = p.read_text()
          old = '''                final String directUrl;\n                if (profile.isXtream()) {\n                    directUrl = new XtreamClient(profile).playbackUrl(requestedType, requestedId, requestedExtension);\n                } else {\n                    directUrl = requestedId;\n                }\n'''
          new = '''                final String directUrl;\n                if (requestedId.startsWith("http://") || requestedId.startsWith("https://")) {\n                    directUrl = requestedId;\n                } else if (profile.isXtream()) {\n                    directUrl = new XtreamClient(profile).playbackUrl(requestedType, requestedId, requestedExtension);\n                } else {\n                    directUrl = requestedId;\n                }\n'''
          if old not in s: raise SystemExit('Player direct URL anchor missing')
          p.write_text(s.replace(old, new, 1))

          # 5) TV UI: disable RecyclerView change animations and debounce expensive hero artwork.
          p = Path('BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/catalog/CatalogActivity.java')
          s = p.read_text()
          s = s.replace('        binding.list.setHasFixedSize(true);\n', '        binding.list.setHasFixedSize(true);\n        binding.list.setItemAnimator(null);\n', 1)
          s = s.replace('        binding.categories.setHasFixedSize(true);\n', '        binding.categories.setHasFixedSize(true);\n        binding.categories.setItemAnimator(null);\n', 1)
          p.write_text(s)

          p = Path('BLOFY-ANDROID-COMMERCIAL/app/src/main/java/tv/blofy/commercial/ui/home/HomeActivity.java')
          s = p.read_text()
          s = s.replace('import android.os.Bundle;\n', 'import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n', 1)
          s = s.replace('    private MediaRecord featured;\n', '    private MediaRecord featured;\n    private final Handler heroHandler = new Handler(Looper.getMainLooper());\n    private Runnable pendingHeroArtwork;\n    private int heroArtworkGeneration;\n', 1)
          s = s.replace('        binding.latest.setHasFixedSize(true);\n', '        binding.latest.setHasFixedSize(true);\n        binding.latest.setItemAnimator(null);\n', 1)
          old = '''        String backdrop = item.backdrop.isEmpty() ? item.image : item.backdrop;\n        BlofyImageLoader.backdrop(this, binding.heroBackdrop, backdrop);\n        BlofyImageLoader.poster(this, binding.heroPoster, item.image);\n        binding.heroPlay.setEnabled(true);\n'''
          new = '''        String backdrop = item.backdrop.isEmpty() ? item.image : item.backdrop;\n        int artworkGeneration = ++heroArtworkGeneration;\n        if (pendingHeroArtwork != null) heroHandler.removeCallbacks(pendingHeroArtwork);\n        pendingHeroArtwork = () -> {\n            if (binding == null || artworkGeneration != heroArtworkGeneration) return;\n            BlofyImageLoader.backdrop(this, binding.heroBackdrop, backdrop);\n            BlofyImageLoader.poster(this, binding.heroPoster, item.image);\n        };\n        heroHandler.postDelayed(pendingHeroArtwork, 140);\n        binding.heroPlay.setEnabled(true);\n'''
          if old not in s: raise SystemExit('Home artwork anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('                        .translationZ(focused ? 8f : 0f).setDuration(120).start();\n', '                        .setDuration(80).start();\n', 1)
          s = s.replace('    @Override protected void onDestroy() {\n        destroyed.set(true);\n', '    @Override protected void onDestroy() {\n        destroyed.set(true);\n        if (pendingHeroArtwork != null) heroHandler.removeCallbacks(pendingHeroArtwork);\n', 1)
          p.write_text(s)

          # 6) Version v21.
          p = Path('BLOFY-ANDROID-COMMERCIAL/app/build.gradle.kts')
          s = p.read_text().replace('versionCode = 2026082220', 'versionCode = 2026082221').replace('versionName = "2026.08.22.20-commercial"', 'versionName = "2026.08.22.21-commercial"')
          p.write_text(s)

      - name: Commit v21
        run: |
          git config user.name "blofy-ci"
          git config user.email "actions@users.noreply.github.com"
          git add BLOFY-ANDROID-COMMERCIAL
          git commit -m "BLOFY v21: instant login, Xtream M3U fallback, faster TV navigation" || exit 0
          git push origin HEAD:blofy-commercial-v20
